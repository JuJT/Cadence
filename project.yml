name: Cadence
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: com.cadence
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '7'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  CadenceCore:
    path: .
targets:
  CadenceSpike:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: App
      - path: Shared
      - path: Resources
        optional: true
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CadenceCore
      - target: CadenceWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CADENCE_SPIKE CADENCE_EXTENSIONS'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/CadenceSpike-Info.plist
      properties:
        CFBundleDisplayName: Cadenza
        CFBundleName: Cadenza
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cadence.study.schedule-refresh]
        NSAppleMusicUsageDescription: 'Choisissez les morceaux de votre bibliothèque et contrôlez la lecture d’Apple Music depuis Cadenza.'
        NSLocationWhenInUseUsageDescription: 'Votre position approximative sert uniquement à rechercher les établissements proches dans l’annuaire PRONOTE lorsque vous choisissez Autour de moi.'
        NSCalendarsFullAccessUsageDescription: 'Cadenza lit vos créneaux de cours pour les intégrer à votre suivi ; aucune donnée n’est envoyée et vos calendriers ne sont jamais modifiés.'
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.cadence.study
            CFBundleURLSchemes: [cadence]
  Cadence:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: &appSources
      - path: App
      - path: Shared
      - path: Resources
        optional: true
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CadenceCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited)'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Cadence-Info.plist
      properties: &appInfo
        CFBundleDisplayName: Cadenza
        CFBundleName: Cadenza
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cadence.study.schedule-refresh]
        NSAppleMusicUsageDescription: 'Choisissez les morceaux de votre bibliothèque et contrôlez la lecture d’Apple Music depuis Cadenza.'
        NSLocationWhenInUseUsageDescription: 'Votre position approximative sert uniquement à rechercher les établissements proches dans l’annuaire PRONOTE lorsque vous choisissez Autour de moi.'
        NSCalendarsFullAccessUsageDescription: 'Cadenza lit vos créneaux de cours pour les intégrer à votre suivi ; aucune donnée n’est envoyée et vos calendriers ne sont jamais modifiés.'
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.cadence.study
            CFBundleURLSchemes: [cadence]
  CadenceExtensions:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: *appSources
    dependencies:
      - package: CadenceCore
      - target: CadenceKeychainWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CADENCE_EXTENSIONS CADENCE_KEYCHAIN_SHARED'
        CODE_SIGN_ENTITLEMENTS: Config/CadenceAppKeychain.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/CadenceExtensions-Info.plist
      properties:
        <<: *appInfo
        NSSupportsLiveActivities: true
  CadenceShared:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: *appSources
    dependencies:
      - package: CadenceCore
      - target: CadenceSharedWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CADENCE_EXTENSIONS CADENCE_SHARED_GROUP'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/CadenceShared.entitlements
    info:
      path: Config/CadenceShared-Info.plist
      properties:
        <<: *appInfo
        NSSupportsLiveActivities: true
        CadenceAppGroupIdentifier: group.com.cadence.study
  CadenceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources: &widgetSources
      - path: Widgets
      - path: Shared
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: CadenceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
    info:
      path: Config/CadenceWidgets-Info.plist
      properties: &widgetInfo
        CFBundleDisplayName: Cadenza
        CFBundleName: Cadenza
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDevelopmentRegion: fr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CadenceSharedWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources: *widgetSources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: CadenceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CADENCE_SHARED_GROUP'
        CODE_SIGN_ENTITLEMENTS: Config/CadenceShared.entitlements
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
    info:
      path: Config/CadenceSharedWidgets-Info.plist
      properties:
        <<: *widgetInfo
        CadenceAppGroupIdentifier: group.com.cadence.study
  CadenceKeychainWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources: *widgetSources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: CadenceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CADENCE_KEYCHAIN_SHARED'
        CODE_SIGN_ENTITLEMENTS: Config/CadenceKeychain.entitlements
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
    info:
      path: Config/CadenceKeychainWidgets-Info.plist
      properties: *widgetInfo
  CadenceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Tests/CadenceUITests
    dependencies:
      - target: CadenceExtensions
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.study.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CadenceExtensions
schemes:
  CadenceSpike:
    build:
      targets:
        CadenceSpike: all
  Cadence:
    build:
      targets:
        Cadence: all
  CadenceExtensions:
    build:
      targets:
        CadenceExtensions: all
    test:
      targets: [CadenceUITests]
      gatherCoverageData: false
  CadenceShared:
    build:
      targets:
        CadenceShared: all
