name: Cadenza · compiler et vérifier sans signature

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Shared/**'
      - 'Widgets/**'
      - 'Config/**'
      - 'Resources/**'
      - 'Scripts/**'
      - 'Runtime/**'
      - 'project.yml'
      - 'Package.swift'
      - '.github/workflows/build-unsigned-ipa.yml'
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'Runner macOS standard gratuit en dépôt public ; Intel disponible en secours'
        type: choice
        options: [macos-26, macos-15, macos-26-intel, macos-15-intel]
        default: macos-26
      free_quota_verified:
        description: 'Quota stockage artefacts (et calcul si privé) vérifié ; usage payant bloqué dans Billing'
        type: boolean
        default: false
      include_shared_variant:
        description: 'Compiler aussi la variante App Group expérimentale (ne garantit pas sa signature)'
        type: boolean
        default: false
      session_presentation_only:
        description: 'Recontrôle ciblé du formulaire après un changement limité à son en-tête'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cadence-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # Runner standard public gratuit. Push public : aucun artefact/cache Actions.
    # Les binaires/rapports vont dans une release BROUILLON, sans publication.
    # Un dépôt privé exige un lancement manuel avec quota vérifié et variable explicite.
    if: >-
      github.event.repository.private == false ||
      (github.event_name == 'workflow_dispatch' && inputs.free_quota_verified &&
       vars.CADENCE_PRIVATE_FREE_CI == 'true')
    permissions:
      contents: write
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'macos-26' }}
    timeout-minutes: 60
    env:
      INCLUDE_SHARED: ${{ (github.event_name == 'push' || inputs.include_shared_variant) && 'true' || 'false' }}
      ONLY_SESSION_PRESENTATION: ${{ inputs.session_presentation_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Construire et tester Pawnote sans données personnelles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          cd Runtime
          npm ci --no-fund 2>&1 | tee ../dist/reports/runtime-install.log
          npm audit --omit=dev 2>&1 | tee ../dist/reports/runtime-audit.log
          npm test 2>&1 | tee ../dist/reports/runtime-tests.log
          npm run build 2>&1 | tee ../dist/reports/runtime-build.log
      - name: Vérifier le SDK et générer le projet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          # Both standard images provide Xcode 26, but macos-15 defaults to 16.
          # Select the newest installed stable 26.x; keep the SDK check below.
          DEVELOPER_DIR="$(python3 - <<'PY'
          from pathlib import Path
          import plistlib, re
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              try:
                  info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
                  version = tuple(int(x) for x in re.findall(r'\d+', info['CFBundleShortVersionString'])[:3])
                  if version and version[0] == 26:
                      candidates.append((version, str(app / 'Contents/Developer')))
              except (OSError, ValueError, KeyError):
                  continue
          assert candidates, 'Aucun Xcode 26 stable installé sur ce runner standard'
          print(max(candidates)[1])
          PY
          )"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version | tee dist/reports/xcode-version.txt
          xcodebuild -showsdks > dist/reports/sdks.txt
          xcrun swift --version > dist/reports/swift-version.txt
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          assert int(re.search(r'Xcode (\d+)', version).group(1)) >= 26, 'SDK Xcode 26 ou récent requis'
          PY
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version | tee dist/reports/xcodegen-version.txt
          xcodegen generate --spec project.yml
      - name: Tester le noyau métier sur macOS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Scripts -p 'test_*.py' 2>&1 | tee dist/reports/diagnostic-tests.log
          swift test 2>&1 | tee dist/reports/core-tests.log
          bash Scripts/test_widget_snapshot.sh 2>&1 | tee dist/reports/widget-snapshot-check-run.log
          bash Scripts/test_pawnote_runtime.sh 2>&1 | tee dist/reports/pawnote-native-runtime.log
          python3 Scripts/verify_prebuilt_focus_shortcut.py 2>&1 | tee dist/reports/focus-shortcut-verification.log
      - name: Compiler les IPA pour appareil physique
        shell: bash
        run: bash Scripts/build_unsigned.sh
      - name: Tester en simulateur et capturer le rendu natif
        timeout-minutes: 40
        shell: bash
        run: bash Scripts/test_simulator.sh
      - name: Joindre les IPA, rapports et captures réels
        if: always() && github.event_name == 'workflow_dispatch' && inputs.free_quota_verified
        uses: actions/upload-artifact@v7
        with:
          name: Cadence-unsigned-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/reports/
            dist/screenshots/
            dist/test-attachments/
            dist/*.xcresult/
          retention-days: 3
          if-no-files-found: warn
      - name: Préparer un brouillon de livraison sans stockage Actions
        if: always() && !cancelled() && github.event.repository.private == false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: bash Scripts/publish_draft_release.sh
      - name: Résumer la vérification
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          {
            echo '## Cadence'
            echo "Résultat du job : $BUILD_RESULT"
            echo 'Les IPA sont non signés. Aucune installation iPhone ou signature gratuite n’a été vérifiée par ce job.'
            echo 'Les captures de simulateur proviennent des pièces jointes XCTest après navigation dans les vrais onglets ; les images bundle sont des inventaires générés.'
            echo 'Un succès de compilation ne valide ni App Groups, ni Sideloadly, ni Live Activity sur appareil réel.'
            echo 'Sur dépôt public, consulter la release brouillon CI correspondante pour les fichiers. Aucun artefact Actions n’est téléversé sur push.'
          } >> "$GITHUB_STEP_SUMMARY"
