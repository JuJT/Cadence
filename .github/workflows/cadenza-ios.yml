name: Cadenza Papillon · compiler l’IPA

on:
  push:
    branches: ["papillon-cadenza/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadenza-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(startsWith(github.ref_name, 'papillon-cadenza/simulator') && '["simulator"]' || '["device", "simulator"]') }}
    permissions:
      contents: write
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      CADENZA_BUILD_DESTINATION: ${{ matrix.destination }}
      BOOTSTRAP: ${{ startsWith(github.ref_name, 'papillon-cadenza/bootstrap') }}
    steps:
      - name: Récupérer la révision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configurer Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Installer les dépendances
        shell: bash
        run: |
          mkdir -p dist/ios-reports
          npm ci --legacy-peer-deps --no-audit --no-fund 2>&1 | tee dist/ios-reports/npm-install.log
      - name: Exécuter les tests JavaScript
        id: jest
        continue-on-error: true
        shell: bash
        run: |
          jest_status=0
          npx --no-install jest --ci --runInBand '--testPathIgnorePatterns=/node_modules/|/scripts/cadenza-study\.test\.mjs$' 2>&1 | tee dist/ios-reports/jest.log || jest_status=$?
          node --test --test-reporter=spec scripts/cadenza-study.test.mjs 2>&1 | tee dist/ios-reports/study-tests.log
          exit "$jest_status"
      - name: Générer et compiler le projet iOS
        shell: bash
        env:
          CADENZA_SIMULATOR_DRAFT: ${{ github.ref_name == 'papillon-cadenza/simulator-retake' && 'papillon-ci-7-1-simulator' || '' }}
          GH_TOKEN: ${{ github.ref_name == 'papillon-cadenza/simulator-retake' && github.token || '' }}
        run: bash scripts/build-cadenza-ios.sh
      - name: Vérifier le résultat des tests
        if: steps.jest.outcome != 'success'
        run: exit 1
      - name: Déposer les sorties du run dans un brouillon GitHub
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p dist/ios-reports
          tag="papillon-ci-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          if [[ "$CADENZA_BUILD_DESTINATION" == simulator ]]; then tag="$tag-simulator"; fi
          {
            printf 'Révision : %s\n' "$GITHUB_SHA"
            printf 'Résultat : %s (%s)\n' "$BUILD_RESULT" "$CADENZA_BUILD_DESTINATION"
            printf 'Run : %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Sorties de vérification. Une IPA éventuellement présente doit être signée avant son installation sur iPhone.\n'
          } > dist/ios-reports/release-notes.md
          (cd dist && zip -qry Cadenza-iOS-verification.zip ios-reports)
          shopt -s nullglob
          files=(dist/Cadenza-iOS-verification.zip dist/*.ipa dist/*-simulator.app.zip)
          if [[ -f dist/SHA256SUMS.txt ]]; then files+=(dist/SHA256SUMS.txt); fi
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Cadenza Papillon · CI #$GITHUB_RUN_NUMBER ($CADENZA_BUILD_DESTINATION, $BUILD_RESULT)" \
            --notes-file dist/ios-reports/release-notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
