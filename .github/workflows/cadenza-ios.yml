name: Cadenza Papillon · compiler l’IPA

on:
  push:
    branches: ["papillon-cadenza/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadenza-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 65
    permissions:
      contents: write
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      BOOTSTRAP: ${{ startsWith(github.ref_name, 'papillon-cadenza/bootstrap') }}
    steps:
      - name: Récupérer la révision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Configurer Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Installer les dépendances
        shell: bash
        run: |
          mkdir -p dist/ios-reports
          npm ci --legacy-peer-deps --no-audit --no-fund 2>&1 | tee dist/ios-reports/npm-install.log
      - name: Exécuter les tests JavaScript
        id: jest
        continue-on-error: true
        shell: bash
        run: npm test -- --ci --runInBand --watchAll=false 2>&1 | tee dist/ios-reports/jest.log
      - name: Générer et compiler le projet iOS
        shell: bash
        run: bash scripts/build-cadenza-ios.sh
      - name: Vérifier le résultat des tests
        if: steps.jest.outcome != 'success'
        run: exit 1
      - name: Déposer les sorties du run dans un brouillon GitHub
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p dist/ios-reports
          tag="papillon-ci-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          {
            printf 'Révision : %s\n' "$GITHUB_SHA"
            printf 'Résultat : %s\n' "$BUILD_RESULT"
            printf 'Run : %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Sorties de vérification. Une IPA éventuellement présente doit être signée avant son installation sur iPhone.\n'
          } > dist/ios-reports/release-notes.md
          (cd dist && zip -qry Cadenza-iOS-verification.zip ios-reports)
          shopt -s nullglob
          files=(dist/Cadenza-iOS-verification.zip dist/*.ipa dist/SHA256SUMS.txt)
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Cadenza Papillon · CI #$GITHUB_RUN_NUMBER ($BUILD_RESULT)" \
            --notes-file dist/ios-reports/release-notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
