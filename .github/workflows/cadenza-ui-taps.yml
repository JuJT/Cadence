name: Cadenza iOS · interactions sur simulateur

on:
  push:
    branches: ["cadenza-qa/ui-taps"]

# The draft asset download requires repository push access. The harness only reads it.
permissions:
  contents: write

jobs:
  taps:
    runs-on: xcode-27
    timeout-minutes: 28
    env:
      SIMULATOR_DRAFT: "papillon-ci-15-1-simulator"
      SIMULATOR_SHA: "345afa9f6823538ab68f5868359fef42e10b84e3"
      CADENZA_QA_ONLY_HOME: 'settings'
      CADENZA_QA_OUTPUT: "cadenza-tap-reports"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Tester les interactions iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash work/cadenza-simulator-qa/run.sh "$GITHUB_REPOSITORY" "$SIMULATOR_DRAFT" "$SIMULATOR_SHA" 0.9.0 11
      - name: Garder les preuves, y compris sur un échec
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cadenza-tap-reports
          path: cadenza-tap-reports/
