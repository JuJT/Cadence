name: Cadenza · vérifier le raccourci Concentration

on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: 'Runner macOS standard gratuit du dépôt public'
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26

permissions:
  contents: read

concurrency:
  group: cadenza-focus-check
  cancel-in-progress: false

jobs:
  shortcut:
    if: github.event.repository.private == false
    permissions:
      contents: write
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vérifier les branches du document
        shell: bash
        run: python3 -m unittest discover -s Scripts -p 'test_focus_shortcut.py'
      - name: Construire et signer avec Raccourcis Apple
        shell: bash
        run: python3 Scripts/prepare_focus_shortcut.py
      - name: Diagnostiquer les descripteurs en cas d’échec
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          roots = [Path('/System/Library/PrivateFrameworks/ActionKit.framework/Resources'),
                   Path('/System/Library/PrivateFrameworks/WorkflowKit.framework/Resources'),
                   Path('/System/Applications/Shortcuts.app/Contents/Resources')]
          for root in roots:
              print(str(root), 'present=', root.exists())
              if root.exists():
                  print('Resource names:', [path.name for path in sorted(root.resolve().iterdir())][:40])
                  paths = sorted(set(path.resolve() for path in root.resolve().glob('**/*Action*.plist')))[:30]
                  print('Action descriptor files:', [str(path) for path in paths])
          PY
      - name: Conserver le fichier signé dans un brouillon privé de publication
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="focus-check-${GITHUB_RUN_ID}"
          cat > dist/reports/focus-release-notes.md <<EOF
          Raccourci Concentration signé par la commande Apple shortcuts sign --mode anyone.

          Révision : ${GITHUB_SHA}
          Run : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Les tests de document et la signature ne valident pas l’exécution sur iPhone.
          EOF
          gh release create "$tag" 'Resources/Shortcuts/Cadenza Concentration.shortcut' \
            dist/reports/focus-shortcut.json dist/reports/focus-shortcut-source.plist \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title 'Cadenza · raccourci Concentration à vérifier sur iPhone' \
            --notes-file dist/reports/focus-release-notes.md
