name: CadenzaTapQA
options:
  deploymentTarget:
    iOS: "17.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Fixture:
    type: application
    platform: iOS
    sources: [Fixture]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cadence.tapqa.fixture
  CadenzaTapTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Fixture
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cadence.tapqa.tests
      TEST_TARGET_NAME: Fixture
schemes:
  CadenzaTapQA:
    build:
      targets:
        Fixture: [test]
        CadenzaTapTests: [test]
    test:
      targets: [CadenzaTapTests]
